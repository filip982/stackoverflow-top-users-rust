[workspace]
resolver = "2"
members = ["so-core", "mock-server"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
uniffi = "=0.32.2"
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum = "0.8"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

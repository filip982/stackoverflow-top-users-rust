# Minimal XcodeGen skeleton. The so-core XCFramework + generated Swift bindings
# are wired in a later phase (see docs/architecture.md). No third-party packages.
name: StackOverflowUsers
options:
  bundleIdPrefix: com.filip982
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  StackOverflowUsers:
    type: application
    platform: iOS
    sources:
      - path: StackOverflowUsers
    settings:
      base:
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: StackOverflowUsers/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.filip982.stackoverflow-users
        DEVELOPMENT_TEAM: ""

  StackOverflowUsersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StackOverflowUsersTests
    dependencies:
      - target: StackOverflowUsers
    settings:
      base:
        SWIFT_VERSION: "6.0"
